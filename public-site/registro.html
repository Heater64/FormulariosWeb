<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0A09" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://formularios-web-flax.vercel.app/registro.html">
<meta name="description" content="Crea la cuenta responsable de tu institución en FormsBiblicos.">
<title>Crear cuenta institucional — FormsBiblicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../js/config/entorno.js" defer></script>
<script src="../js/core/store.js" defer></script>
<script src="../js/core/eventBus.js" defer></script>
<script src="../js/core/errores.js" defer></script>
<script src="../js/datos/supabase-client.js" defer></script>
<script src="../js/datos/auth-repository.js" defer></script>
<script src="./registro.js" defer></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--a:#2563EB;--ah:#1D4ED8;--as:#EFF6FF;--ag:rgba(37,99,235,.12);--t:#1C1917;--ts:#78716C;--tt:#A8A29E;--f:#FAFAF9;--fa:#F5F5F4;--c:#FFF;--b:#E7E5E4;--e:#B91C1C;--es:#FEE2E2;--x:#065F46;--xs:#D1FAE5;--d:"Newsreader",Georgia,serif;--body:"Inter",sans-serif;--sm:14px;--md:18px;--lg:26px;--xl:36px;--r:10px;--rx:18px;--touch:48px}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--t:#FAFAF9;--ts:#A8A29E;--tt:#78716C;--f:#0C0A09;--fa:#1C1917;--c:#1C1917;--b:#292524;--a:#60A5FA;--ah:#3B82F6;--as:#1E3A5F;--ag:rgba(96,165,250,.15);--e:#FCA5A5;--es:#7F1D1D;--x:#A7F3D0;--xs:#064E3B}}:root[data-theme="dark"]{--t:#FAFAF9;--ts:#A8A29E;--tt:#78716C;--f:#0C0A09;--fa:#1C1917;--c:#1C1917;--b:#292524;--a:#60A5FA;--ah:#3B82F6;--as:#1E3A5F;--ag:rgba(96,165,250,.15);--e:#FCA5A5;--es:#7F1D1D;--x:#A7F3D0;--xs:#064E3B}html{font-size:16px}body{min-height:100vh;background:var(--f);color:var(--t);font-family:var(--body);display:flex;flex-direction:column}a{color:var(--a);text-decoration:none}a:hover{text-decoration:underline}.header{padding:10px var(--md);border-bottom:1px solid var(--b)}.logo{display:flex;align-items:center;gap:10px;color:var(--t);font-family:var(--d);font-size:1.15rem;font-weight:600}.logo-icon{width:36px;height:36px;border-radius:var(--r);background:var(--a);display:grid;place-items:center}.logo-icon img{width:78%;height:78%}.main{width:min(100% - 36px,520px);margin:auto;padding:var(--xl) 0}.card{background:var(--c);border:1px solid var(--b);border-radius:var(--rx);padding:var(--xl) var(--lg);box-shadow:0 8px 24px -6px rgba(0,0,0,.12);position:relative}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--a),#60A5FA,var(--a))}.icon{width:52px;height:52px;margin:0 auto var(--md);padding:8px;border-radius:50%;background:var(--as);display:grid;place-items:center}.icon img{width:100%;height:100%}h1{font-family:var(--d);font-size:clamp(1.6rem,6vw,2.1rem);text-align:center;margin-bottom:var(--sm)}.sub{text-align:center;color:var(--ts);font-size:var(--sm);line-height:1.6;margin-bottom:var(--lg)}.campo{margin-bottom:var(--md)}label{display:block;font-size:var(--sm);font-weight:600;margin-bottom:6px}input{width:100%;min-height:var(--touch);padding:12px 14px;border:1.5px solid var(--b);border-radius:var(--r);background:var(--fa);color:var(--t);font:inherit;font-size:16px}input:focus{outline:none;border-color:var(--a);background:var(--c);box-shadow:0 0 0 3px var(--ag)}button{width:100%;min-height:var(--touch);padding:12px 16px;background:var(--a);border:0;border-radius:var(--r);color:#fff;font:inherit;font-size:var(--sm);font-weight:700;cursor:pointer;box-shadow:0 2px 8px var(--ag)}button:hover{background:var(--ah)}button:disabled{opacity:.65;cursor:wait}.msg{display:none;padding:12px 14px;border-radius:var(--r);font-size:var(--sm);line-height:1.5;margin-bottom:var(--md)}.msg.visible{display:block}.msg.error{background:var(--es);color:var(--e)}.msg.success{background:var(--xs);color:var(--x)}.foot{text-align:center;color:var(--tt);font-size:var(--sm);margin-top:var(--lg);line-height:1.7}.foot a{color:var(--ts)}.hidden{display:none!important}*:focus-visible{outline:2px solid var(--a);outline-offset:2px}@media(max-width:480px){.main{width:min(100% - 28px,520px);padding:var(--lg) 0}.card{padding:var(--xl) var(--md)}}
</style>
</head>
<body>
<header class="header"><a class="logo" href="index.html" aria-label="FormsBiblicos - Inicio"><span class="logo-icon"><img src="/assets/iconos/icono.svg" alt=""></span><span>FormsBiblicos</span></a></header>
<main class="main"><section class="card" aria-labelledby="tituloRegistro">
  <div class="icon"><img src="/assets/iconos/icono.svg" alt=""></div>
  <h1 id="tituloRegistro">Crea tu institución</h1>
  <p class="sub">Empieza con la cuenta responsable. Después podrás crear tu primera clase e invitar a tu equipo.</p>
  <div class="msg error" id="errorRegistro" role="alert"></div><div class="msg success" id="exitoRegistro" role="status"></div>
  <form id="formRegistro" novalidate>
    <div class="campo"><label for="nombreRegistro">Tu nombre completo</label><input id="nombreRegistro" type="text" autocomplete="name" required></div>
    <div class="campo"><label for="emailRegistro">Correo electrónico</label><input id="emailRegistro" type="email" autocomplete="email" required></div>
    <div class="campo"><label for="passwordRegistro">Contraseña</label><input id="passwordRegistro" type="password" autocomplete="new-password" placeholder="8 caracteres, letras y números" required></div>
    <div class="campo"><label for="confirmarRegistro">Confirmar contraseña</label><input id="confirmarRegistro" type="password" autocomplete="new-password" required></div>
    <button type="submit" id="btnRegistro">Crear cuenta y continuar</button>
  </form>
  <p class="foot"><a href="index.html">Ya tengo una cuenta</a> · <a href="privacidad.html">Privacidad</a></p>
</section></main>
</body>
</html>
