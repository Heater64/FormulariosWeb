<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="La página que buscas no existe en FormsBiblicos.">
<title>Página no encontrada — FormsBiblicos</title>
<script src="./theme.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root {
    --accento: #2563EB; --accento-hover: #1D4ED8; --accento-soft: #EFF6FF; --acento-glow: rgba(37,99,235,0.12);
    --texto: #1C1917; --texto-sec: #78716C; --texto-ter: #A8A29E;
    --fondo: #FAFAF9; --fondo-alt: #F5F5F4; --tarjeta: #FFFFFF; --borde: #E7E5E4;
    --fuente-display: "Newsreader", Georgia, serif; --fuente-body: "Inter", sans-serif;
    --xs: 10px; --sm: 14px; --md: 18px; --lg: 26px; --xl: 36px; --2xl: 52px;
    --radio-md: 10px; --radio-xl: 18px; --toque: 48px;
    --fast: 200ms cubic-bezier(0.4,0,0.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --texto: #FAFAF9; --texto-sec: #A8A29E; --texto-ter: #78716C; --fondo: #0C0A09; --fondo-alt: #1C1917; --tarjeta: #1C1917; --borde: #292524; --accento: #60A5FA; --accento-hover: #3B82F6; --accento-soft: #1E3A5F; --acento-glow: rgba(96,165,250,0.15); }
  }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body { font-family: var(--fuente-body); background: var(--fondo); color: var(--texto); min-height: 100vh; display: flex; flex-direction: column; }

  .header {
    display: flex; align-items: center; gap: 10px;
    padding: var(--xs) var(--md);
    padding-top: calc(var(--xs) + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--borde);
  }
  .header__logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--texto); }
  .header__icono {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: var(--radio-md);
    background: var(--accento); color: #fff;
  }
  .header__icono-img { width: 78%; height: 78%; object-fit: contain; }
  .header__texto { font-family: var(--fuente-display); font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em; }

  .error {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: var(--2xl) var(--md);
    position: relative; overflow: hidden;
  }
  .error::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(40rem 24rem at 50% 0%, var(--accento-soft) 0%, transparent 60%);
    pointer-events: none;
  }
  .error > * { position: relative; }

  .error__codigo {
    font-family: var(--fuente-display); font-size: clamp(5rem, 24vw, 9rem);
    font-weight: 600; line-height: 1; letter-spacing: -0.03em;
    color: var(--accento); margin-bottom: var(--xs);
  }
  .error__titulo {
    font-family: var(--fuente-display); font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 600; margin-bottom: var(--xs); letter-spacing: -0.02em;
  }
  .error__texto {
    font-size: var(--sm); color: var(--texto-sec); line-height: 1.6;
    max-width: 42ch; margin: 0 auto var(--lg);
  }
  .error__btn {
    display: inline-block; padding: 14px 28px;
    background: var(--accento); color: #fff; text-decoration: none;
    border-radius: var(--radio-md); font: inherit; font-size: var(--sm);
    font-weight: 700; min-height: var(--toque);
    box-shadow: 0 2px 8px var(--acento-glow);
    transition: background var(--fast), transform var(--fast);
  }
  .error__btn:hover { background: var(--accento-hover); transform: translateY(-1px); }
  .error__btn:active { transform: translateY(0); }

  .footer {
    padding: var(--md) var(--md) calc(var(--md) + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: var(--sm);
    font-size: var(--xs); color: var(--texto-ter);
    border-top: 1px solid var(--borde);
  }
  .footer a { color: var(--accento); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .footer__links { display: flex; gap: var(--md); }

  *:focus-visible { outline: 2px solid var(--accento); outline-offset: 2px; }
</style>
</head>
<body>

<header class="header">
  <a href="/" class="header__logo" aria-label="FormsBiblicos - Inicio">
    <span class="header__icono">
      <img src="/assets/iconos/icono.svg" alt="" class="header__icono-img">
    </span>
    <span class="header__texto">FormsBiblicos</span>
  </a>
</header>

<main class="error">
  <p class="error__codigo" aria-hidden="true">404</p>
  <h1 class="error__titulo">Esta página no existe</h1>
  <p class="error__texto">Puede que el enlace esté mal escrito o que la página se haya movido. Vuelve al inicio para seguir con tu estudio.</p>
  <a href="/" class="error__btn">Volver al inicio</a>
</main>

<footer class="footer">
  <p>FormsBiblicos © 2026</p>
  <div class="footer__links">
    <a href="privacidad.html">Privacidad</a>
    <a href="terminos.html">Términos</a>
    <a href="licencias.html">Licencias</a>
    <a href="contacto.html">Contacto</a>
  </div>
</footer>

</body>
</html>
