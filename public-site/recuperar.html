<style>

  html{font-size:16px;-webkit-font-smoothing:antialiased}body{min-height:100vh;font-family:var(--fuente-body);background:var(--fondo);color:var(--texto);display:flex;flex-direction:column}a{color:var(--accento);text-decoration:none}a:hover{text-decoration:underline}.header{display:flex;align-items:center;padding:10px var(--md);border-bottom:1px solid var(--borde)}.logo{display:flex;align-items:center;gap:10px;color:var(--texto);font-family:var(--fuente-display);font-size:1.15rem;font-weight:600}.logo-icon{width:36px;height:36px;border-radius:var(--radio-md);background:var(--accento);display:grid;place-items:center}.logo-icon img{width:78%;height:78%;object-fit:contain}.main{width:min(100% - 36px,460px);margin:auto;padding:var(--xl) 0}.card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--radio-xl);padding:var(--xl) var(--lg);box-shadow:0 8px 24px -6px rgba(0,0,0,.12);position:relative;overflow:hidden}.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accento),#60A5FA,var(--accento))}.icon{width:52px;height:52px;margin:0 auto var(--md);padding:8px;border-radius:50%;background:var(--accento-soft);display:grid;place-items:center}.icon img{width:100%;height:100%;object-fit:contain}.title{font-family:var(--fuente-display);font-size:clamp(1.6rem,6vw,2rem);font-weight:700;text-align:center;margin-bottom:var(--sm)}.sub{text-align:center;color:var(--texto-sec);font-size:var(--sm);line-height:1.6;margin-bottom:var(--lg)}.campo{margin-bottom:var(--md)}label{display:block;font-size:var(--sm);font-weight:600;margin-bottom:6px}input{width:100%;min-height:var(--toque);padding:12px 14px;border:1.5px solid var(--borde);border-radius:var(--radio-md);background:var(--fondo-alt);color:var(--texto);font:inherit;font-size:16px}input:focus{outline:none;border-color:var(--accento);background:var(--tarjeta);box-shadow:0 0 0 3px var(--acento-glow)}button{width:100%;min-height:var(--toque);padding:12px 16px;border:0;border-radius:var(--radio-md);background:var(--accento);color:#fff;font:inherit;font-size:var(--sm);font-weight:700;cursor:pointer;box-shadow:0 2px 8px var(--acento-glow);transition:all var(--fast)}button:hover{background:var(--accento-hover);transform:translateY(-1px)}button:disabled{opacity:.65;cursor:wait;transform:none}.mensaje{display:none;padding:12px 14px;border-radius:var(--radio-md);font-size:var(--sm);line-height:1.5;margin-bottom:var(--md)}.mensaje.visible{display:block}.mensaje.error{background:var(--error-soft);color:var(--error)}.mensaje.exito{background:var(--exito-soft);color:var(--exito)}.footer{text-align:center;color:var(--texto-ter);font-size:var(--sm);margin-top:var(--lg);line-height:1.7}.footer a{color:var(--texto-sec)}.oculto{display:none!important}*:focus-visible{outline:2px solid var(--accento);outline-offset:2px}@media(max-width:480px){.main{width:min(100% - 28px,460px);padding:var(--lg) 0}.card{padding:var(--xl) var(--md)}}

<body>
<header class="header"><a class="logo" href="./index.html" aria-label="FormsBiblicos - Inicio"><span class="logo-icon"><img src="/assets/iconos/icono.svg" alt=""></span><span>FormsBiblicos</span></a></header>
<main class="main"><section class="card" aria-labelledby="tituloRecuperacion">
  <div class="icon"><img src="/assets/iconos/icono.svg" alt=""></div>
  <h1 class="title" id="tituloRecuperacion">Recuperar acceso</h1>
  <p class="sub" id="subtituloRecuperacion">Solicita un enlace para recuperar la contraseña de tu cuenta.</p>
  <div class="mensaje error" id="errorRecuperacion" role="alert"></div>
  <div class="mensaje exito" id="exitoRecuperacion" role="status"></div>
  <form id="formSolicitar" novalidate>
    <div class="campo"><label for="correoRecuperacion">Correo electrónico</label><input id="correoRecuperacion" type="email" autocomplete="email" placeholder="tu@correo.com" required></div>
    <button type="submit" id="btnSolicitar">Enviar enlace de recuperación</button>
  </form>
  <form id="formNuevaPassword" class="oculto" novalidate>
    <div class="campo"><label for="nuevaPassword">Nueva contraseña</label><input id="nuevaPassword" type="password" autocomplete="new-password" placeholder="8 caracteres, letras y números" required></div>
    <div class="campo"><label for="confirmarPassword">Confirmar contraseña</label><input id="confirmarPassword" type="password" autocomplete="new-password" required></div>
    <button type="submit" id="btnActualizar">Guardar nueva contraseña</button>
  </form>
  <p class="footer"><a href="index.html">Volver al inicio de sesión</a> · <a href="contacto.html">Contactar con soporte</a></p>
</section></main>
