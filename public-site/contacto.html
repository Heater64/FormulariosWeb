<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contacto — FormsBiblicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://formularios-web-flax.vercel.app/contacto.html">
<meta name="description" content="Contacta con el equipo de FormsBiblicos: preguntas, sugerencias o problemas.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FormsBiblicos">
<meta property="og:title" content="Contacto — FormsBiblicos">
<meta property="og:description" content="¿Tienes preguntas, sugerencias o problemas? Escríbenos.">
<meta property="og:image" content="https://formularios-web-flax.vercel.app/og-1200x630.png">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<script src="./theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../js/config/entorno.js" defer></script>
<script src="../js/datos/supabase-client.js" defer></script>
<script src="./contacto.js" defer></script>
<script src="./legal.js" defer></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root {
    --accento: #2563EB; --accento-hover: #1D4ED8; --accento-soft: #EFF6FF; --acento-glow: rgba(37,99,235,0.12);
    --texto: #1C1917; --texto-sec: #78716C; --texto-ter: #A8A29E;
    --fondo: #FAFAF9; --fondo-alt: #F5F5F4; --tarjeta: #FFFFFF; --borde: #E7E5E4;
    --error: #B91C1C; --error-soft: #FEE2E2;
    --fuente-display: "Newsreader", Georgia, serif; --fuente-body: "Inter", sans-serif;
    --xxs: 6px; --xs: 10px; --sm: 14px; --md: 18px; --lg: 26px; --xl: 36px;
    --radio-md: 10px; --radio-lg: 14px;
    --toque: 48px; --fast: 200ms cubic-bezier(0.4,0,0.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --texto: #FAFAF9; --texto-sec: #A8A29E; --texto-ter: #78716C; --fondo: #0C0A09; --fondo-alt: #1C1917; --tarjeta: #1C1917; --borde: #292524; --accento: #60A5FA; --accento-hover: #3B82F6; --accento-soft: #1E3A5F; --acento-glow: rgba(96,165,250,0.15); --error: #FCA5A5; --error-soft: #7F1D1D; }
  }
  html { font-size: 16px; }
  body { font-family: var(--fuente-body); background: var(--fondo); color: var(--texto); line-height: 1.7; }
  .page { max-width: 520px; margin: 0 auto; padding: var(--xl) var(--md) 80px; }
  a { color: var(--accento); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--texto-sec); margin-bottom: var(--lg); }
  .back:hover { color: var(--texto); text-decoration: none; }
  h1 { font-family: var(--fuente-display); font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 600; margin-bottom: var(--xs); letter-spacing: -0.02em; }
  .sub { font-size: 15px; color: var(--texto-sec); margin-bottom: var(--xl); }

  .campo { margin-bottom: var(--md); }
  .campo__label { display: block; font-size: var(--sm); font-weight: 600; color: var(--texto); margin-bottom: 6px; }
  .campo__input, .campo__textarea {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--borde); border-radius: var(--radio-md);
    background: var(--fondo-alt); color: var(--texto);
    font: inherit; font-size: 16px; transition: border-color var(--fast), box-shadow var(--fast), background var(--fast);
  }
  .campo__input::placeholder, .campo__textarea::placeholder { color: var(--texto-ter); }
  .campo__input:hover, .campo__textarea:hover { border-color: var(--texto-ter); }
  .campo__input:focus, .campo__textarea:focus {
    outline: none; border-color: var(--accento); background: var(--tarjeta);
    box-shadow: 0 0 0 3px var(--acento-glow);
  }
  .campo__textarea { min-height: 140px; resize: vertical; }

  .btn-submit {
    width: 100%; padding: 12px var(--md);
    background: var(--accento); color: #fff; border: none;
    border-radius: var(--radio-md); font: inherit; font-size: var(--sm);
    font-weight: 700; cursor: pointer; min-height: var(--toque);
    transition: all var(--fast); margin-top: var(--xs);
    box-shadow: 0 2px 8px var(--acento-glow);
  }
  .btn-submit:hover { background: var(--accento-hover); transform: translateY(-1px); box-shadow: 0 4px 16px var(--acento-glow); }
  .btn-submit:active { transform: translateY(0); }

  .exito {
    display: none; padding: 12px 14px; background: #D1FAE5; color: #065F46;
    border-radius: var(--radio-md); font-size: var(--sm); font-weight: 500; margin-bottom: var(--md);
  }
  .exito.visible { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .exito { background: #064E3B; color: #A7F3D0; }
  }
</style>
</head>
<body>
<div class="page">
  <a href="index.html" class="back">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Volver
  </a>
  <h1>Contacto</h1>
  <p class="sub">¿Tienes preguntas, sugerencias o problemas? Escríbenos.</p>

  <div class="exito" id="exitoMsg">Mensaje enviado. Te responderemos pronto.</div>

  <form id="contactForm" novalidate>
    <div class="campo">
      <label class="campo__label" for="nombre">Nombre</label>
      <input class="campo__input" type="text" id="nombre" placeholder="Tu nombre" required>
    </div>
    <div class="campo">
      <label class="campo__label" for="email">Correo electrónico</label>
      <input class="campo__input" type="email" id="email" placeholder="tu@correo.com" required>
    </div>
    <div class="campo">
      <label class="campo__label" for="mensaje">Mensaje</label>
      <textarea class="campo__textarea" id="mensaje" placeholder="¿En qué podemos ayudarte?" required></textarea>
    </div>
    <button type="submit" class="btn-submit">Enviar mensaje</button>
  </form>
</div>
</body>
</html>
