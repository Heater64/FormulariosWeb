<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sin conexión — FormsBiblicos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e2e;
      color: #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      text-align: center;
    }
    .offline-card {
      max-width: 360px;
      padding: 40px 24px;
      background: #27272a;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .offline-icon { font-size: 64px; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p { font-size: 0.875rem; color: #a1a1aa; line-height: 1.5; }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-retry:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📖</div>
    <h1>Sin conexión</h1>
    <p>No tienes internet. Conéctate para seguir usando FormsBiblicos.</p>
    <button class="btn-retry" onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
