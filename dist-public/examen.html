<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<!-- El enlace individual es privado: nunca debe indexarse. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Realiza tu examen.">
<title>Examen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/iconos/icono.svg" type="image/svg+xml">
<!-- Rutas ABSOLUTAS a propósito: el alumno abre /e/<token>, que vercel.json
     reescribe a /examen.html SIN cambiar la URL. Con rutas relativas, el
     navegador resolvería ./examen.js como /e/examen.js (404) y la página
     quedaría cargando para siempre. -->
<script src="/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="/js/config/entorno.js" defer></script>
<script src="/js/datos/supabase-client.js" defer></script>
<script src="/examen.js" defer></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --a:#2563EB;--ah:#1D4ED8;--as:#EFF6FF;--ag:rgba(37,99,235,.12);
    --t:#0F172A;--ts:#475569;--tt:#5E6D84;--f:#F8FAFC;--fa:#F1F5F9;--c:#FFFFFF;--b:#E2E8F0;
    --e:#B91C1C;--es:#FEF2F2;--ok:#065F46;--oks:#D1FAE5;--warn:#92400E;--warns:#FEF3C7;
    --d:"Inter",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;
    --xs:11px;--sm:14px;--md:18px;--lg:26px;--xl:34px;
    --r:10px;--rx:16px;--touch:48px;
    --sombra:0 1px 2px rgba(28,25,23,.06),0 8px 24px -12px rgba(28,25,23,.18);
    --rapida:200ms cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --t:#E6EDF7;--ts:#94A3B8;--tt:#7A8AA3;--f:#0B1220;--fa:#16213A;--c:#111A2C;--b:#243149;
    --a:#3B82F6;--ah:#60A5FA;--as:rgba(59,130,246,.14);--ag:rgba(59,130,246,.24);
    --e:#F87171;--es:rgba(239,68,68,.13);--ok:#A7F3D0;--oks:#064E3B;--warn:#FCD34D;--warns:#78350F;
    --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }}
  :root[data-theme="dark"]{
    --t:#E6EDF7;--ts:#94A3B8;--tt:#7A8AA3;--f:#0B1220;--fa:#16213A;--c:#111A2C;--b:#243149;
    --a:#3B82F6;--ah:#60A5FA;--as:rgba(59,130,246,.14);--ag:rgba(59,130,246,.24);
    --e:#F87171;--es:rgba(239,68,68,.13);--ok:#A7F3D0;--oks:#064E3B;--warn:#FCD34D;--warns:#78350F;
    --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
  html{font-size:16px;-webkit-text-size-adjust:100%}
  body{min-height:100vh;background:var(--f);color:var(--t);font-family:var(--body);line-height:1.5;display:flex;flex-direction:column}
  *:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:4px}

  .cabecera{
    position:sticky;top:0;z-index:20;background:var(--f);
    border-bottom:1px solid var(--b);
    padding:10px var(--md);padding-top:calc(10px + env(safe-area-inset-top,0px));
    display:flex;align-items:center;gap:10px;
  }
  .cabecera__logo{display:flex;align-items:center;gap:10px;min-width:0}
  .cabecera__icono{flex:0 0 auto;width:32px;height:32px;border-radius:var(--r);background:var(--a);display:grid;place-items:center}
  .cabecera__icono img{width:76%;height:76%;object-fit:contain}
  .cabecera__info{min-width:0}
  .cabecera__titulo{font-family:var(--d);font-size:1rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cabecera__sub{font-size:var(--xs);color:var(--tt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cabecera__estado{margin-left:auto;font-size:var(--xs);color:var(--tt);flex:0 0 auto}

  .progreso{position:sticky;top:0;z-index:19;height:3px;background:var(--b)}
  .progreso__barra{height:100%;width:0;background:var(--a);transition:width var(--rapida)}

  .lienzo{flex:1;width:min(100% - 32px,760px);margin:0 auto;padding:var(--lg) 0 calc(160px + env(safe-area-inset-bottom,0px))}
  .lienzo--estrecho{width:min(100% - 32px,560px)}
  .lienzo--centrado{display:flex;align-items:center;justify-content:center;padding-bottom:var(--lg)}

  .tarjeta{background:var(--c);border:1px solid var(--b);border-radius:var(--rx);padding:var(--lg);box-shadow:var(--sombra)}
  .tarjeta__icono{width:48px;height:48px;border-radius:50%;background:var(--as);display:grid;place-items:center;margin-bottom:var(--md);color:var(--a);font-size:1.4rem}
  .tarjeta__icono--error{background:var(--es);color:var(--e)}

  h1{font-family:var(--d);font-size:clamp(1.5rem,5.5vw,2rem);font-weight:600;letter-spacing:-.02em;line-height:1.2}
  h2{font-family:var(--d);font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--ts);font-size:var(--sm);line-height:1.65}
  .meta{display:flex;flex-wrap:wrap;gap:var(--xs);margin:var(--md) 0}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--fa);border:1px solid var(--b);font-size:var(--xs);font-weight:600;color:var(--ts)}

  .campo{margin-bottom:var(--md)}
  label{display:block;font-size:var(--sm);font-weight:600;margin-bottom:6px}
  .ayuda{font-size:var(--xs);color:var(--tt);font-weight:400;margin-top:5px}
  input[type="text"],textarea{
    width:100%;min-height:var(--touch);padding:12px 14px;border:1.5px solid var(--b);
    border-radius:var(--r);background:var(--fa);color:var(--t);font:inherit;font-size:16px;
    transition:border-color var(--rapida),background var(--rapida),box-shadow var(--rapida);
  }
  input[type="text"]:focus,textarea:focus{outline:none;border-color:var(--a);background:var(--c);box-shadow:0 0 0 3px var(--ag)}
  textarea{min-height:132px;resize:vertical;line-height:1.6}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:var(--touch);padding:13px 20px;border:0;border-radius:var(--r);
    background:var(--a);color:#fff;font:inherit;font-size:var(--sm);font-weight:700;cursor:pointer;
    box-shadow:0 2px 8px var(--ag);transition:background var(--rapida),transform var(--rapida);
  }
  .btn:hover{background:var(--ah)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .btn--secundario{background:transparent;color:var(--ts);border:1.5px solid var(--b);box-shadow:none}
  .btn--secundario:hover{background:var(--fa)}

  .aviso{padding:12px 14px;border-radius:var(--r);font-size:var(--sm);line-height:1.55;margin-bottom:var(--md)}
  .aviso--error{background:var(--es);color:var(--e)}
  .aviso--ok{background:var(--oks);color:var(--ok)}
  .aviso--warn{background:var(--warns);color:var(--warn)}
  .oculto{display:none !important}

  /* ── Preguntas ── */
  .pregunta{padding:var(--md) 0 var(--lg);border-bottom:1px solid var(--b)}
  .pregunta:last-of-type{border-bottom:0}
  .pregunta__cabecera{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .pregunta__numero{flex:0 0 auto;font-size:var(--xs);font-weight:700;color:var(--a);letter-spacing:.04em;text-transform:uppercase}
  .pregunta__puntos{margin-left:auto;flex:0 0 auto;font-size:var(--xs);color:var(--tt);font-weight:600}
  .pregunta__texto{font-size:1rem;font-weight:600;line-height:1.55;margin-bottom:14px;white-space:pre-wrap}
  .pregunta__obligatoria{color:var(--e);font-weight:700}
  .pregunta__etiqueta{display:block;font-size:var(--sm);font-weight:600;margin-bottom:6px;color:var(--ts)}
  .pregunta--sin-responder .pregunta__texto::after{
    content:'Sin responder';display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;
    background:var(--warns);color:var(--warn);font-size:var(--xs);font-weight:600;vertical-align:middle;
  }

  fieldset{border:0}
  .opciones{display:flex;flex-direction:column;gap:10px}
  .opcion{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1.5px solid var(--b);border-radius:var(--r);background:var(--fa);cursor:pointer;transition:border-color var(--rapida),background var(--rapida)}
  .opcion:hover{border-color:var(--a);background:var(--c)}
  .opcion input{flex:0 0 auto;width:20px;height:20px;margin-top:1px;accent-color:var(--a);cursor:pointer}
  .opcion__texto{font-size:var(--sm);line-height:1.55;word-break:break-word}
  .opcion:has(input:checked){border-color:var(--a);background:var(--as)}
  .opcion:has(input:focus-visible){box-shadow:0 0 0 3px var(--ag)}

  select{
    width:100%;min-height:var(--touch);padding:12px 14px;border:1.5px solid var(--b);
    border-radius:var(--r);background:var(--fa);color:var(--t);font:inherit;font-size:16px;
    transition:border-color var(--rapida),background var(--rapida),box-shadow var(--rapida);
  }
  select:focus{outline:none;border-color:var(--a);background:var(--c);box-shadow:0 0 0 3px var(--ag)}

  /* ── Relacionar columnas ── */
  .relacionar{display:flex;flex-direction:column;gap:12px}
  .relacionar__fila{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1.5px solid var(--b);border-radius:var(--r);background:var(--fa)}
  .relacionar__texto{font-size:var(--sm);font-weight:600;line-height:1.5;word-break:break-word}

  /* ── Ordenar elementos ── */
  .ordenar{display:flex;flex-direction:column;gap:10px}
  .ordenar__fila{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--b);border-radius:var(--r);background:var(--fa)}
  .ordenar__pos{flex:0 0 auto;min-width:1.6em;font-size:var(--xs);font-weight:700;color:var(--a)}
  .ordenar__texto{flex:1;font-size:var(--sm);line-height:1.5;word-break:break-word}
  .ordenar__acciones{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
  .ordenar__btn{
    width:44px;height:34px;display:grid;place-items:center;border:1.5px solid var(--b);
    border-radius:8px;background:var(--c);color:var(--ts);font-size:12px;cursor:pointer;
    transition:border-color var(--rapida),color var(--rapida),background var(--rapida);
  }
  .ordenar__btn:hover:not(:disabled){border-color:var(--a);color:var(--a);background:var(--as)}
  .ordenar__btn:disabled{opacity:.4;cursor:not-allowed}

  .barra-envio{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--c);
    border-top:1px solid var(--b);padding:12px var(--md);
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:center;gap:var(--md);justify-content:space-between;
    box-shadow:0 -4px 20px -8px rgba(28,25,23,.18);
  }
  .barra-envio__info{font-size:var(--xs);color:var(--ts);line-height:1.4}
  .barra-envio__acciones{display:flex;gap:10px;align-items:center}
  .barra-envio .btn{width:auto;min-width:180px}
  .punto-guardado{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tt);margin-right:6px;transition:background var(--rapida)}
  .punto-guardado--on{background:var(--ok)}

  /* ── Nota ── */
  .nota{font-family:var(--d);font-size:clamp(3rem,16vw,4.5rem);font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--a)}
  .nota__sobre{font-size:1rem;color:var(--tt);font-family:var(--body);letter-spacing:0;margin-left:6px}
  .detalle{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:var(--md)}
  .detalle li{display:flex;justify-content:space-between;gap:var(--md);padding:10px 12px;border:1px solid var(--b);border-radius:var(--r);font-size:var(--sm)}

  .pie{padding:var(--md);text-align:center;font-size:var(--xs);color:var(--tt)}
  .pie a{color:var(--ts)}

  @media (max-width:560px){
    .lienzo{width:min(100% - 24px,760px);padding-top:var(--md)}
    .tarjeta{padding:var(--md)}
    .barra-envio{flex-direction:column;align-items:stretch;gap:8px}
    .barra-envio__info{text-align:center}
    .barra-envio__acciones{flex-direction:column-reverse;width:100%}
    .barra-envio .btn{width:100%;min-width:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<header class="cabecera">
  <span class="cabecera__icono"><img src="/assets/iconos/icono.svg" alt=""></span>
  <span class="cabecera__info">
    <span class="cabecera__titulo" id="cabTitulo">Examen</span>
    <span class="cabecera__sub" id="cabSub"></span>
  </span>
  <span class="cabecera__estado" id="cabEstado"></span>
</header>
<div class="progreso" aria-hidden="true"><div class="progreso__barra" id="progresoBarra"></div></div>

<main class="lienzo" id="lienzo" aria-live="polite">
  <section class="tarjeta">
    <p class="sub" id="cargando">Cargando el examen…</p>
  </section>
</main>

<footer class="pie">
  <p id="pieTexto">Tus respuestas se guardan en este dispositivo mientras completas el examen.</p>
</footer>

<div id="estadoSr" role="status" aria-live="polite" class="oculto"></div>

</body>
</html>
