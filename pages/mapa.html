<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Estudio Bíblico - Mapa de la Biblia</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- MAIN -->
<main class="main-content">
    <div class="page-header">
        <div>
            <h1 class="page-title"><i data-lucide="map"></i> Mapa de la Biblia</h1>
            <p class="page-subtitle">Tus libros estudiados a simple vista</p>
        </div>
    </div>

    <div id="mapaContent">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Cargando mapa...</p>
        </div>
    </div>
</main>

<!-- MODAL DETALLE DE LIBRO -->
<div id="libroModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h2 id="libroModalTitulo"><i data-lucide="book-open"></i> Libro</h2>
            <button onclick="window.cerrarLibroModal()" class="modal-close"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="modal-body" id="libroModalBody"></div>
    </div>
</div>

<!-- NOTIFICACIONES -->
<div id="notificationContainer" class="notification-container"></div>

<!-- JAVASCRIPT -->
<script src="../js/core/config.js"></script>
<script src="../js/core/utils.js"></script>
<script src="../js/core/app.js"></script>
<script src="../js/auth/users.js"></script>
<script src="../js/auth/auth.js"></script>
<script src="../js/shared/forms.js"></script>
<script src="../js/shared/responses.js"></script>
<script src="../js/shared/organization.js"></script>
<script src="../js/usuario/estudio.js"></script>
<script src="../js/usuario/mapa.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const user = window.checkAuth();
        if (!user) return;
        window.updateNavbar();
        if (typeof lucide !== 'undefined') lucide.createIcons();
        if (typeof window.renderMapa === 'function') window.renderMapa();
    });
</script>

    <script src="../js/core/system.js"></script>
</body>
</html>
