<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Estudio Bíblico - Inicio</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<main class="main-content">

    <!-- Hero section -->
    <div class="dash-hero" id="dashHero">
        <div class="dash-hero-content">
            <p class="dash-hero-greeting">Buenos días, <strong id="greetingName">amigo</strong></p>
            <p class="dash-hero-sub">¿Qué te gustaría estudiar hoy?</p>
        </div>
        <div class="dash-hero-illustration" data-illustration="reading"></div>
    </div>

    <!-- Quick actions -->
    <div class="dash-actions">
        <a href="estudio.html" class="dash-action-card dash-action-primary">
            <span class="dash-action-icon"><i data-lucide="book-open"></i></span>
            <span class="dash-action-text">
                <span class="dash-action-title">Continuar estudiando</span>
                <span class="dash-action-desc">Sigue donde lo dejaste</span>
            </span>
            <span class="dash-action-arrow"><i data-lucide="arrow-right"></i></span>
        </a>
        <a href="editor.html" class="dash-action-card dash-action-secondary" id="crearExamenDashboard" style="display:none;">
            <span class="dash-action-icon"><i data-lucide="plus-circle"></i></span>
            <span class="dash-action-text">
                <span class="dash-action-title">Crear examen</span>
                <span class="dash-action-desc">Diseña un nuevo formulario</span>
            </span>
            <span class="dash-action-arrow"><i data-lucide="arrow-right"></i></span>
        </a>
    </div>

    <!-- Stats -->
    <section class="dash-section">
        <div class="dash-section-head">
            <h2 class="dash-section-title">Tu resumen</h2>
            <p class="dash-section-sub">Un vistazo a tu actividad general.</p>
        </div>
        <div class="dash-stats" id="dashboardStats">
            <div class="dash-stat">
                <div class="dash-stat-icon" style="background:var(--primary-soft);color:var(--primary);">
                    <i data-lucide="clipboard-list"></i>
                </div>
                <div class="dash-stat-body">
                    <span class="dash-stat-number" id="statTotalExamenes">0</span>
                    <span class="dash-stat-label">Exámenes</span>
                </div>
            </div>
            <div class="dash-stat">
                <div class="dash-stat-icon" style="background:var(--secondary-soft);color:var(--secondary);">
                    <i data-lucide="help-circle"></i>
                </div>
                <div class="dash-stat-body">
                    <span class="dash-stat-number" id="statTotalPreguntas">0</span>
                    <span class="dash-stat-label">Preguntas</span>
                </div>
            </div>
            <div class="dash-stat" data-visibilidad="admin">
                <div class="dash-stat-icon" style="background:var(--accent-soft);color:var(--accent);">
                    <i data-lucide="pen-line"></i>
                </div>
                <div class="dash-stat-body">
                    <span class="dash-stat-number" id="statTotalRespuestas">0</span>
                    <span class="dash-stat-label">Respuestas</span>
                </div>
            </div>
            <div class="dash-stat">
                <div class="dash-stat-icon" style="background:var(--warning-soft);color:var(--warning);">
                    <i data-lucide="award"></i>
                </div>
                <div class="dash-stat-body">
                    <span class="dash-stat-number" id="statNotaMedia">0.00</span>
                    <span class="dash-stat-label">Nota media</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Filter tabs + search -->
    <section class="dash-section">
        <div class="dash-section-head">
            <h2 class="dash-section-title">Tus exámenes</h2>
            <p class="dash-section-sub">Accede rápido a todo tu material.</p>
        </div>

        <div class="dash-filter-bar">
            <div class="dash-filter-tabs" id="filterTabs">
                <button class="dash-filter-tab active" data-filter="all" onclick="window.setFilter('all')">
                    <i data-lucide="layers"></i> Todos
                </button>
                <button class="dash-filter-tab" data-filter="favorites" data-visibilidad="admin" onclick="window.setFilter('favorites')">
                    <i data-lucide="star"></i> Favoritos
                </button>
                <button class="dash-filter-tab" data-filter="trash" data-visibilidad="admin" onclick="window.setFilter('trash')">
                    <i data-lucide="trash-2"></i> Papelera
                </button>
            </div>
            <div class="dash-search" id="dashSearch">
                <i data-lucide="search" class="dash-search-icon"></i>
                <input type="text" id="searchInput" class="dash-search-input" placeholder="Buscar examen..." oninput="window.filterForms()" />
                <button class="dash-search-clear" id="searchClear" onclick="document.getElementById('searchInput').value='';window.filterForms();this.style.display='none'" style="display:none">
                    <i data-lucide="x"></i>
                </button>
            </div>
        </div>

        <div id="formList" class="dash-grid">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Cargando...</p>
            </div>
        </div>
    </section>

</main>

<div id="notificationContainer" class="notification-container"></div>

<script src="../js/core/config.js"></script>
<script src="../js/core/utils.js"></script>
<script src="../js/auth/users.js"></script>
<script src="../js/auth/auth.js"></script>
<script src="../js/shared/forms.js"></script>
<script src="../js/shared/responses.js"></script>
<script src="../js/shared/organization.js"></script>
<script src="../js/core/app.js"></script>
<script src="../js/usuario/dashboard.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof window.checkAuth === 'function') {
            const user = window.checkAuth();
            if (!user) return;
            const gn = document.getElementById('greetingName');
            if (gn) {
                const name = (user.fullName || user.username || 'amigo').split(' ')[0];
                gn.textContent = name;
                // Time-based greeting
                var h = new Date().getHours();
                var greeting = h < 12 ? 'Buenos días' : h < 18 ? 'Buenas tardes' : 'Buenas noches';
                var hero = document.querySelector('.dash-hero-greeting');
                if (hero) hero.innerHTML = greeting + ', <strong>' + name + '</strong>';
            }
            // Ocultar stats solo-admin para usuarios normales
            if (typeof window.isAdmin === 'function' && !window.isAdmin()) {
                document.querySelectorAll('[data-visibilidad="admin"]').forEach(function(el) {
                    el.style.display = 'none';
                });
            }
            if (typeof window.isEditor === 'function' && window.isEditor()) {
                const ce = document.getElementById('crearExamenDashboard');
                if (ce) ce.style.display = '';
            }
        }
        if (typeof window.updateNavbar === 'function') window.updateNavbar();
        if (typeof lucide !== 'undefined') lucide.createIcons();
        if (typeof window.renderDashboard === 'function') window.renderDashboard();
        if (typeof window.cargarNotificacionesPendientes === 'function') window.cargarNotificacionesPendientes();

        // Search clear button
        var si = document.getElementById('searchInput');
        var sc = document.getElementById('searchClear');
        if (si && sc) {
            si.addEventListener('input', function() {
                sc.style.display = this.value ? 'flex' : 'none';
            });
        }
    });
</script>

    <script src="../js/core/system.js"></script>
</body>
</html>
