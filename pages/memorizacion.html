<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Estudio Bíblico - Memorización</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- MAIN -->
<main class="main-content">
    <div class="page-header">
        <div>
            <h1 class="page-title"><i data-lucide="brain"></i> Memorización</h1>
            <p class="page-subtitle">Memoriza versículos, libros y autores de la Biblia</p>
        </div>
    </div>

    <div id="memContent">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Cargando...</p>
        </div>
    </div>
</main>

<!-- NOTIFICACIONES -->
<div id="notificationContainer" class="notification-container"></div>

<!-- JAVASCRIPT -->
<script src="../js/core/config.js"></script>
<script src="../js/core/utils.js"></script>
<script src="../js/core/app.js"></script>
<script src="../js/auth/users.js"></script>
<script src="../js/auth/auth.js"></script>
<script src="../js/shared/forms.js"></script>
<script src="../js/shared/responses.js"></script>
<script src="../js/shared/organization.js"></script>
<script src="../js/usuario/mapa.js"></script>
<script src="../js/usuario/memorizacion.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const user = window.checkAuth();
        if (!user) return;
        window.updateNavbar();
        if (typeof lucide !== 'undefined') lucide.createIcons();
        if (typeof window.renderMemorizacion === 'function') window.renderMemorizacion();
    });
</script>

    <script src="../js/core/system.js"></script>
</body>
</html>
