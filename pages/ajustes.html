<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Estudio Bíblico - Ajustes</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ====== MAIN CONTENT ====== -->
<main class="main-content">
    <div class="page-header">
        <div>
            <h1 class="page-title"><i data-lucide="settings"></i> Ajustes</h1>
            <p class="page-subtitle">Personaliza tu experiencia</p>
        </div>
    </div>
    <div id="ajustesContent">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Cargando ajustes...</p>
        </div>
    </div>
</main>

<!-- ====== MODAL REINICIAR (paso 2: escribir REINICIAR) ====== -->
<div id="reiniciarTextoModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h2><i data-lucide="alert-triangle"></i> ÚLTIMA OPORTUNIDAD</h2>
            <button onclick="window.cerrarReiniciarTexto()" class="modal-close"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="modal-body">
            <p>Vas a eliminar <strong>TODOS</strong> tus datos de estudio.</p>
            <p>¿Estás absolutamente seguro?</p>
            <label class="ajustes-label">Escribe <strong>REINICIAR</strong> para confirmar:</label>
            <input type="text" id="reiniciarInput" class="form-input" placeholder="REINICIAR"
                   style="text-transform: uppercase; letter-spacing: 1px; font-weight: 700;" />
            <button id="reiniciarConfirmarBtn" onclick="window.reiniciarPaso3()" class="btn-danger w-full mt-3" disabled>
                Confirmar
            </button>
        </div>
    </div>
</div>

<!-- ====== NOTIFICACIONES ====== -->
<div id="notificationContainer" class="notification-container"></div>

<!-- ====== MODAL SOLICITUD EDITOR ====== -->
<div id="solicitudEditorModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h2><i data-lucide="pen-line"></i> Solicitud de Editor</h2>
            <button onclick="window.cerrarSolicitudEditor()" class="modal-close"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="modal-body">
            <div class="input-group">
                <label>Nombre</label>
                <input type="text" id="solNombre" class="form-input" readonly />
            </div>
            <div class="input-group">
                <label>Clase</label>
                <input type="text" id="solClase" class="form-input" readonly />
            </div>
            <div class="input-group">
                <label>Motivo <span class="text-red-500">*</span></label>
                <textarea id="solMotivo" class="form-input" rows="3" placeholder="¿Por qué quieres ser Editor?"></textarea>
            </div>
            <div class="input-group">
                <label>Experiencia <span class="text-red-500">*</span></label>
                <textarea id="solExperiencia" class="form-input" rows="3" placeholder="Ej. He estudiado la Biblia por 10 años"></textarea>
            </div>
            <button onclick="window.enviarSolicitudEditor()" class="btn-primary w-full mt-3">
                <i data-lucide="send" class="w-4 h-4"></i> Enviar solicitud
            </button>
        </div>
    </div>
</div>

<!-- ====== MODAL CREAR CLASE ====== -->
<div id="crearClaseModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h2><i data-lucide="shield"></i> Mi clase</h2>
            <button onclick="window.cerrarCrearClase()" class="modal-close"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="modal-body">
            <div class="input-group">
                <label>Nombre de la clase</label>
                <input type="text" id="claseNombre" class="form-input" placeholder="Ej. Congregación Central" />
            </div>
            <button onclick="window.guardarClase()" class="btn-primary w-full mt-3">
                <i data-lucide="check" class="w-4 h-4"></i> Guardar
            </button>
        </div>
    </div>
</div>

<!-- ====== MODAL AÑADIR USUARIO ====== -->
<div id="anadirUsuarioModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h2><i data-lucide="plus"></i> Añadir usuario</h2>
            <button onclick="window.cerrarAnadirUsuario()" class="modal-close"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="modal-body">
            <div class="input-group">
                <label>Nombre completo <span class="text-red-500">*</span></label>
                <input type="text" id="usuNombre" class="form-input" placeholder="Ej. Juan Pérez" />
            </div>
            <div class="input-group">
                <label>Usuario (para iniciar sesión) <span class="text-red-500">*</span></label>
                <input type="text" id="usuUsuario" class="form-input" placeholder="Ej. juanp" />
            </div>
            <div class="input-group">
                <label>Contraseña <span class="text-red-500">*</span></label>
                <input type="text" id="usuPassword" class="form-input" placeholder="Mínimo 4 caracteres" />
            </div>
            <div class="input-group">
                <label>Rol</label>
                <select id="usuRol" class="form-input">
                    <option value="usuario">Alumno</option>
                    <option value="editor">Editor</option>
                </select>
            </div>
            <button onclick="window.guardarUsuario()" class="btn-primary w-full mt-3">
                <i data-lucide="check" class="w-4 h-4"></i> Crear usuario
            </button>
        </div>
    </div>
</div>

<!-- ====== MODAL EDITAR USUARIO ====== -->
<div id="editarUsuarioModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <h2><i data-lucide="pencil"></i> Editar usuario</h2>
            <button onclick="window.cerrarEditarUsuario()" class="modal-close"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editUserId" />
            <div class="input-group">
                <label>Nombre completo</label>
                <input type="text" id="editNombre" class="form-input" placeholder="Nombre" />
            </div>
            <div class="input-group">
                <label>Contraseña nueva (dejar en blanco para no cambiarla)</label>
                <input type="text" id="editPassword" class="form-input" placeholder="Mínimo 4 caracteres" />
            </div>
            <button onclick="window.guardarEditarUsuario()" class="btn-primary w-full mt-3">
                <i data-lucide="check" class="w-4 h-4"></i> Guardar cambios
            </button>
        </div>
    </div>
</div>

<!-- ====== JAVASCRIPT ====== -->
<script src="../js/core/config.js"></script>
<script src="../js/core/utils.js"></script>
<script src="../js/core/app.js"></script>
<script src="../js/auth/users.js"></script>
<script src="../js/auth/auth.js"></script>
<script src="../js/shared/forms.js"></script>
<script src="../js/shared/responses.js"></script>
<script src="../js/shared/organization.js"></script>
<script src="../js/usuario/ajustes.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const user = window.checkAuth();
        if (!user) return;
        window.updateNavbar();
        if (typeof lucide !== 'undefined') lucide.createIcons();
        if (typeof window.initAjustes === 'function') window.initAjustes();
        if (typeof window.cargarNotificacionesPendientes === 'function') window.cargarNotificacionesPendientes();
    });
</script>

    <script src="../js/core/system.js"></script>
</body>
</html>
