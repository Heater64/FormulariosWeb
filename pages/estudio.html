<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Estudio Bíblico - Mi Estudio</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ====== MAIN CONTENT ====== -->
<main class="main-content">
    <div id="estudioContent" class="estudio-container">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Cargando estudio...</p>
        </div>
    </div>
</main>

<!-- ====== NOTIFICACIONES ====== -->
<div id="notificationContainer" class="notification-container"></div>

<!-- ====== JAVASCRIPT ====== -->
<script src="../js/core/config.js"></script>
<script src="../js/core/utils.js"></script>
<script src="../js/core/app.js"></script>
<script src="../js/auth/users.js"></script>
<script src="../js/auth/auth.js"></script>
<script src="../js/shared/forms.js"></script>
<script src="../js/shared/responses.js"></script>
<script src="../js/shared/organization.js"></script>
<script src="../js/usuario/memorizacion.js"></script>
<script src="../js/usuario/mapa.js"></script>
<script src="../js/usuario/estudio.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const user = window.checkAuth();
        if (!user) return;
        window.updateNavbar();
        if (typeof lucide !== 'undefined') lucide.createIcons();
        if (typeof window.renderEstudio === 'function') window.renderEstudio();
    });
</script>

    <script src="../js/core/system.js"></script>

<!-- Modal para el detalle de libro (usado por el tab Libros) -->
<div id="libroModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title" id="libroModalTitulo">Libro</h3>
            <button class="modal-close" onclick="window.cerrarLibroModal()">&times;</button>
        </div>
        <div class="modal-body" id="libroModalBody"></div>
    </div>
</div>
</body>
</html>
