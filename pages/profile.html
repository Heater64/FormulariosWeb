<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Estudio Bíblico - Perfil</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<main class="main-content">
    <div class="page-header">
        <div>
            <h1 class="page-title"><i data-lucide="user-round"></i> Mi Perfil</h1>
            <p class="page-subtitle">Información personal y actividad</p>
        </div>
    </div>

    <div id="profileContent">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Cargando perfil...</p>
        </div>
    </div>

    <!-- Edit profile modal -->
    <div id="editProfileModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h2><i data-lucide="pencil"></i> Editar perfil</h2>
                <button onclick="window.cerrarEditProfile()" class="modal-close"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Nombre completo</label>
                    <input type="text" id="editNombreCompleto" class="form-input" />
                </div>
                <button onclick="window.guardarEditProfile()" class="btn-primary w-full mt-3">
                    <i data-lucide="check"></i> Guardar cambios
                </button>
            </div>
        </div>
    </div>
</main>

<div id="notificationContainer" class="notification-container"></div>

<script src="../js/core/config.js"></script>
<script src="../js/core/utils.js"></script>
<script src="../js/core/app.js"></script>
<script src="../js/auth/users.js"></script>
<script src="../js/auth/auth.js"></script>
<script src="../js/shared/forms.js"></script>
<script src="../js/shared/responses.js"></script>
<script src="../js/shared/organization.js"></script>
<script src="../js/usuario/profile.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const user = window.checkAuth();
        if (!user) return;
        window.updateNavbar();
        if (typeof lucide !== 'undefined') lucide.createIcons();
        if (typeof window.initProfile === 'function') window.initProfile();
    });
</script>

    <script src="../js/core/system.js"></script>
</body>
</html>
