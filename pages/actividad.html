<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Estudio Bíblico - Actividad</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<main class="main-content">
    <div class="page-header">
        <div>
            <h1 class="page-title"><i data-lucide="bell"></i> Centro de Actividad</h1>
            <p class="page-subtitle" id="actividadSubtitle">Notificaciones y actividad reciente</p>
        </div>
    </div>
    <div id="actividadContent">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Cargando actividad...</p>
        </div>
    </div>
</main>

<div id="notificationContainer" class="notification-container"></div>

<script src="../js/core/config.js"></script>
<script src="../js/core/utils.js"></script>
<script src="../js/core/app.js"></script>
<script src="../js/auth/users.js"></script>
<script src="../js/auth/auth.js"></script>
<script src="../js/shared/forms.js"></script>
<script src="../js/shared/responses.js"></script>
<script src="../js/shared/organization.js"></script>
<script src="../js/usuario/actividad.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const user = window.checkAuth();
        if (!user) return;
        window.updateNavbar();
        if (typeof lucide !== 'undefined') lucide.createIcons();
        if (typeof window.cargarActividad === 'function') window.cargarActividad();
    });
</script>

    <script src="../js/core/system.js"></script>
</body>
</html>
