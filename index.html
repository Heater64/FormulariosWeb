<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormPro Cloud</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css" />
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ============================================ -->
<!-- NAVBAR -->
<!-- ============================================ -->
<nav class="glass fixed top-0 left-0 right-0 z-50 px-6 py-4 border-b border-gray-100/50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <span class="text-2xl font-bold text-gray-900">✦ FormPro</span>
        <div class="flex gap-3 items-center">
            <span id="statusDot" class="w-2 h-2 rounded-full bg-green-400 inline-block"></span>
            <span id="statusText" class="text-sm text-gray-400">online</span>
            <button onclick="showView('dashboard')" class="text-sm text-gray-600 hover:text-gray-900">Dashboard</button>
            <button onclick="showView('editor')" class="btn-blue text-sm py-2 px-4">+ Nuevo</button>
        </div>
    </div>
</nav>

<!-- ============================================ -->
<!-- CONTENIDO PRINCIPAL -->
<!-- ============================================ -->
<div class="pt-24 pb-12 max-w-6xl mx-auto px-4">

    <!-- ========== VISTA: DASHBOARD ========== -->
    <div id="view-dashboard">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Mis Formularios</h1>
            <button onclick="showView('editor')" class="btn-blue text-sm py-2 px-4">+ Crear</button>
        </div>
        <div id="formList">
            <div class="text-center py-12">
                <div class="loading mx-auto"></div>
                <p class="mt-4 text-gray-400">Cargando formularios...</p>
            </div>
        </div>
    </div>

    <!-- ========== VISTA: EDITOR ========== -->
    <div id="view-editor" class="hidden">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="goBack()" class="text-gray-400 hover:text-gray-600">← Volver</button>
            <h1 class="text-2xl font-bold text-gray-900">
                <span id="editorTitle">Nuevo Formulario</span>
            </h1>
        </div>
        
        <div class="card">
            <input id="formTitle" class="form-input text-2xl font-semibold border-none bg-transparent p-0" 
                   placeholder="Título del formulario" value="Mi formulario" />
            <p class="text-sm text-gray-400 mt-2" id="questionCounter">0 preguntas</p>
        </div>

        <div id="questionsContainer" class="space-y-3 mt-4"></div>

        <div class="flex flex-wrap gap-2 p-4 bg-white/50 rounded-2xl mt-4">
            <button onclick="addQuestion('text')" class="px-4 py-2 rounded-full border border-gray-200 hover:bg-gray-50 text-sm">✏️ Texto</button>
            <button onclick="addQuestion('textarea')" class="px-4 py-2 rounded-full border border-gray-200 hover:bg-gray-50 text-sm">📝 Párrafo</button>
            <button onclick="addQuestion('radio')" class="px-4 py-2 rounded-full border border-gray-200 hover:bg-gray-50 text-sm">⭕ Opción única</button>
            <button onclick="addQuestion('checkbox')" class="px-4 py-2 rounded-full border border-gray-200 hover:bg-gray-50 text-sm">☑️ Opción múltiple</button>
            <button onclick="addQuestion('select')" class="px-4 py-2 rounded-full border border-gray-200 hover:bg-gray-50 text-sm">📋 Desplegable</button>
        </div>

        <div class="flex gap-3 mt-6">
            <button onclick="saveForm()" class="btn-blue flex-1 py-3 text-lg">💾 Guardar Formulario</button>
        </div>
    </div>

    <!-- ========== VISTA: VER FORMULARIO ========== -->
    <div id="view-form" class="hidden">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="goBack()" class="text-gray-400 hover:text-gray-600">← Volver</button>
        </div>
        <div id="formViewContent"></div>
    </div>

    <!-- ========== VISTA: RESPUESTAS ========== -->
    <div id="view-responses" class="hidden">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="goBack()" class="text-gray-400 hover:text-gray-600">← Volver</button>
            <h1 class="text-2xl font-bold text-gray-900">📊 Respuestas</h1>
        </div>
        <div id="responsesContent"></div>
    </div>
</div>

<!-- ============================================ -->
<!-- JAVASCRIPT - Carga en orden -->
<!-- ============================================ -->

<!-- 1. Configuración (con tus credenciales) -->
<script src="js/config.js"></script>

<!-- 2. Utilidades -->
<script src="js/utils.js"></script>

<!-- 3. Módulo de formularios -->
<script src="js/forms.js"></script>

<!-- 4. Módulo de respuestas -->
<script src="js/responses.js"></script>

<!-- 5. Aplicación principal -->
<script src="js/app.js"></script>

</body>
</html>
