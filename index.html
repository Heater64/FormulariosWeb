  <!-- ============================================================
       Theme bootstrap (corre pre-CSS): evita el flash de tema al cargar.
       Lee preferencias de localStorage sincrónicamente y aplica
       data-theme + un fondo inicial, antes de que se renderice el
       CSS. Cuando los tokens (--color-fondo, etc.) se definan más
       tarde, los componentes usarán esos valores. Importante: solo
       aplicamos estilos INLINE sobre el propio elemento <html>, NO
       sobre variables CSS (eso pisaría el sistema de tokens y
       rompería los cambios de tema vía UI). Tambien sincroniza
       la meta theme-color para que la statusbar del navegador
       coincida con el tema elegido.
       ============================================================ -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('fb_preferencias');
        var p = null;
        try { p = raw ? JSON.parse(raw) : null; } catch (e) {}
        var tema = (p && p.tema) || localStorage.getItem('fb_tema');
        if (tema === 'claro') tema = 'light';
        else if (tema === 'oscuro') tema = 'dark';
        var root = document.documentElement;
        var isDark = tema === 'dark';
        var isLight = tema === 'light';
        if (isLight || isDark) root.setAttribute('data-theme', tema);
        var hc = p && p.alto_contraste === true;
        var bg = isDark ? (hc ? '#000000' : '#0F172A') : '#FFFFFF';
        var txt = isDark ? '#FFFFFF' : '#0F172A';
        // Color de fondo inmediato solo en el propio elemento root.
        // Los tokens (--color-fondo) se definen luego desde CSS y
        // se aplican a <body>, así que no hay conflicto de cascada.
        root.style.backgroundColor = bg;
        root.style.color = txt;
        root.style.colorScheme = isDark ? 'dark' : 'light';
        // Sincroniza la meta theme-color con el tema + HC
        var meta = document.head.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      } catch (e) { /* offline / no localStorage -> defaults del navegador */ }
    })();
  </script>

  <!-- JS: Service Worker (producción) + Update Detection -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          let refreshing = false;

          // Listen for update messages from SW
          navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data?.type === 'SW_UPDATE_AVAILABLE') {
              showUpdateCard(event.data);
            }
          });

          reg.addEventListener('updatefound', () => {
            const worker = reg.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller && !refreshing) {
                refreshing = true;
                window.location.reload();
              }
            });
          });

          // Periodic check for updates
          setInterval(() => reg.update(), 5 * 60 * 1000);
        }).catch(e => console.warn('SW:', e.message));
      });
    }

    function showUpdateCard({ version, features, fixes, performance }) {
      if (document.getElementById('updateCard')) return;
      const card = document.createElement('div');
      card.id = 'updateCard';
      card.className = 'update-card';
      card.setAttribute('role', 'alertdialog');
      card.setAttribute('aria-modal', 'true');
      card.innerHTML = `
        <div class="update-card__content">
          <div class="update-card__icon">${window.Iconos?.render('download-cloud') || '⬇'}</div>
          <h2 class="update-card__title">Nueva versión disponible</h2>
          <p class="update-card__subtitle">Versión ${version}</p>
          <ul class="update-card__list">
            ${(features || []).map(f => `<li>${window.Iconos?.render('check') || '✓'} ${f}</li>`).join('')}
            ${(fixes || []).map(f => `<li>${window.Iconos?.render('bug') || '🐛'} ${f}</li>`).join('')}
            ${(performance || []).map(f => `<li>${window.Iconos?.render('zap') || '⚡'} ${f}</li>`).join('')}
          </ul>
          <button class="btn-primario update-card__btn" id="updateNowBtn">Actualizar ahora</button>
        </div>`;
      document.body.appendChild(card);
      window.Iconos?.actualizar?.();

      card.querySelector('#updateNowBtn').onclick = () => {
        const btn = card.querySelector('#updateNowBtn');
        btn.disabled = true;
        btn.textContent = 'Descargando…';

        // Cuando el nuevo SW tome el control, recargamos para aplicar la versión.
        let recargado = false;
        const onControllerChange = () => {
          if (recargado) return;
          recargado = true;
          // La sesión persiste en localStorage, así que se mantiene tras reload.
          window.location.reload();
        };
        navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);

        // Pedir al SW instalado que se active (descarga la nueva versión).
        navigator.serviceWorker.getRegistration().then((reg) => {
          const waiting = reg && reg.waiting;
          if (waiting) {
            waiting.postMessage({ type: 'SKIP_WAITING' });
          } else if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
          } else {
            // Sin SW controlador: recargar para forzar la toma de control.
            window.location.reload();
          }
        });

        card.classList.add('update-card--hiding');
        setTimeout(() => card.remove(), 300);

        // Fallback por si controllerchange no dispara.
        setTimeout(() => { if (!recargado) window.location.reload(); }, 4000);
      };
    }
  </script>

  <!-- JS: Feedback háptico -->
  <script>
    document.addEventListener('click', e => {
      if ('vibrate' in navigator && e.target.closest('button, a, [role="button"], .btn-primario, .btn-secundario, .btn-instalar'))
        navigator.vibrate(8);
    }, { passive: true });
  </script>

      if (window.connectionIndicator) window.connectionIndicator.iniciar();
      if (window.syncStatus) window.syncStatus.iniciar();
    });
