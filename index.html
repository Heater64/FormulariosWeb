  <!-- viewport-fit=cover: aprovecha la pantalla completa (edge-to-edge) con
       safe-area insets. interactive-widget=resizes-content: el teclado virtual
       de Android redimensiona la viewport para que el campo activo quede
       visible (sin esto el teclado tapa inputs). Sin maximum-scale ni
       user-scalable=no: el zoom por pellizco debe funcionar (WCAG 1.4.4). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- ============================================================
       Theme bootstrap (corre pre-CSS): evita el flash de tema al cargar.
       Lee preferencias de localStorage sincrónicamente y aplica
       data-theme + un fondo inicial, antes de que se renderice el
       CSS. Cuando los tokens (--color-fondo, etc.) se definan más
       tarde, los componentes usarán esos valores. Importante: solo
       aplicamos estilos INLINE sobre el propio elemento <html>, NO
       sobre variables CSS (eso pisaría el sistema de tokens y
       rompería los cambios de tema vía UI). Tambien sincroniza
       la meta theme-color para que la statusbar del navegador
       coincida con el tema elegido.
       ============================================================ -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('fb_preferencias');
        var p = null;
        try { p = raw ? JSON.parse(raw) : null; } catch (e) {}
        var tema = (p && p.tema) || localStorage.getItem('fb_tema');
        if (tema === 'claro') tema = 'light';
        else if (tema === 'oscuro') tema = 'dark';
        var root = document.documentElement;
        var isDark = tema === 'dark';
        var isLight = tema === 'light';
        if (isLight || isDark) root.setAttribute('data-theme', tema);
        var hc = p && p.alto_contraste === true;
        var bg = isDark ? (hc ? '#000000' : '#0F172A') : '#FFFFFF';
        var txt = isDark ? '#FFFFFF' : '#0F172A';
        // Color de fondo inmediato solo en el propio elemento root.
        // Los tokens (--color-fondo) se definen luego desde CSS y
        // se aplican a <body>, así que no hay conflicto de cascada.
        root.style.backgroundColor = bg;
        root.style.color = txt;
        root.style.colorScheme = isDark ? 'dark' : 'light';
        // Sincroniza la meta theme-color con el tema + HC
        var meta = document.head.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      } catch (e) { /* offline / no localStorage -> defaults del navegador */ }
    })();
  </script>

  <!-- ============================================================
       Captura global de errores (corre antes que cualquier script):
       alimenta el buffer que procesa error-recovery.js (primer
       script diferido). Sin esto, un error en el arranque pasaría
       desapercibido y la app podría quedarse en blanco.
       ============================================================ -->
  <script>
    (function () {
      window.__fbErrores = [];
      window.__fbRegistrarError = function (e) {
        try {
          var msg = (e && e.message) || (e && e.name) || String(e);
          window.__fbErrores.push({ ts: Date.now(), msg: msg });
        } catch (err) {}
        if (window.errorRecovery && window.errorRecovery.registrarError) {
          try { window.errorRecovery.registrarError(e); } catch (err) {}
        }
      };
      window.addEventListener('error', function (e) {
        // Los errores de recursos (img, link, audio, vídeo...) no son errores
        // de código: no cuentan para la autorrecuperación (si no, cualquier
        // imagen rota dispararía una reparación de caché falsa).
        if (e && e.target && !e.error) return;
        window.__fbRegistrarError(e.error || e);
      }, true);
      window.addEventListener('unhandledrejection', function (e) { window.__fbRegistrarError(e.reason); });
    })();
  </script>

  <!-- ============================================================

  <!-- JS: App Shell (module porque usa import() dinámico para vistas lazy;
       como script clásico Vite le inyecta un import de /@vite/client y
       el navegador lanza "Cannot use import statement outside a module".
       Los módulos se ejecutan en orden tras los scripts defer, y este es
       el último script de la página, así que el orden no cambia. -->
  <script type="module" src="js/core/index.js"></script>

  <!-- JS: Feedback háptico -->
  <script>
    document.addEventListener('click', e => {
      if ('vibrate' in navigator && e.target.closest('button, a, [role="button"], .btn-primario, .btn-secundario'))
        navigator.vibrate(8);
    }, { passive: true });
  </script>

  <!-- JS: Indicadores de conexión y sincronización -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.connectionIndicator) window.connectionIndicator.iniciar();
      if (window.syncStatus) window.syncStatus.iniciar();
    });
  </script>

  <!-- JS: Teclado → ocultar la barra inferior mientras se escribe (el teclado
       virtual tapa la parte inferior; la barra reaparece al desenfocar). -->
  <script>
    document.addEventListener('focusin', (e) => {
      if (e.target && e.target.matches && e.target.matches('input, textarea, select, [contenteditable="true"]')) {
        if (window.navigationManager) window.navigationManager.ocultarPorTeclado(true);
      }
    }, true);
    document.addEventListener('focusout', (e) => {
      if (e.target && e.target.matches && e.target.matches('input, textarea, select, [contenteditable="true"]')) {
        if (window.navigationManager) window.navigationManager.ocultarPorTeclado(false);
      }
    }, true);
  </script>
