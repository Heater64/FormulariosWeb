  <!-- JS: Instalación PWA -->
  <script>
    let deferredPrompt = null;
    document.addEventListener('DOMContentLoaded', () => {
      const installBtn = document.createElement('div');
      installBtn.id = 'installPwaBtn';
      installBtn.innerHTML = '<button class="btn-instalar" style="position:fixed;bottom:140px;left:50%;transform:translateX(-50%);z-index:100;display:none;align-items:center;gap:8px;padding:12px 20px;background:#2563EB;color:white;border:none;border-radius:14px;font-size:0.875rem;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,0.4);-webkit-tap-highlight-color:transparent">⬇ Instalar app</button>';
      document.body.appendChild(installBtn);
      const btn = installBtn.querySelector('.btn-instalar');

      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredPrompt = e;
        btn.style.display = 'flex';
      });

      btn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Instalación:', outcome);
        deferredPrompt = null;
        btn.style.display = 'none';
      });

      window.addEventListener('appinstalled', () => { btn.style.display = 'none'; deferredPrompt = null; });
    });
  </script>

  <!-- JS: Service Worker (producción) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.addEventListener('updatefound', () => {
            const worker = reg.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        }).catch(e => console.warn('SW:', e.message));
      });
    }
  </script>

  <!-- JS: Feedback háptico -->
  <script>
    document.addEventListener('click', e => {
      if ('vibrate' in navigator && e.target.closest('button, a, [role="button"], .btn-primario, .btn-secundario, .btn-instalar'))
        navigator.vibrate(8);
    }, { passive: true });
  </script>
