  <script>
    // Bootstrap de tema (corre antes del paint): claro por defecto,
    // respeta la preferencia oscura guardada en localStorage.
    (function () {
      try {
        var raw = localStorage.getItem('fb_preferencias');
        var p = null;
        try { p = raw ? JSON.parse(raw) : null; } catch (e) {}
        var tema = (p && p.tema) || localStorage.getItem('fb_tema') || 'light';
        if (tema === 'claro') tema = 'light';
        else if (tema === 'oscuro') tema = 'dark';
        if (tema === 'light' || tema === 'dark') {
          document.documentElement.setAttribute('data-theme', tema);
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script src="../js/core/eventBus.js"></script>
  <script src="../js/datos/supabase-client.js"></script>
  <script src="../js/datos/auth-repository.js"></script>
  <script src="../js/utilidades/dom-helpers.js"></script>
  <script src="../js/utilidades/iconos.js"></script>
  <script src="../js/vistas/vista-login.js"></script>
  <script>
    // Página standalone: persistir sesión y redirigir al SPA al iniciar sesión
    window.eventBus.suscribir('auth:login', (payload) => {
      const usuario = payload.usuario || payload;
      if (payload.recordar !== false) {
        localStorage.setItem('fb_usuario', JSON.stringify(usuario));
        localStorage.setItem('fb_recordar_sesion', 'true');
      } else {
        localStorage.removeItem('fb_usuario');
        localStorage.removeItem('fb_recordar_sesion');
        sessionStorage.setItem('fb_usuario', JSON.stringify(usuario));
      }
      window.location.href = '../index.html#!/estudio';
    });

    document.addEventListener('DOMContentLoaded', () => {
      // Si ya hay sesión activa, ir directo al SPA
      const guardado = localStorage.getItem('fb_usuario') || sessionStorage.getItem('fb_usuario');
      if (guardado) {
        window.location.href = '../index.html#!/estudio';
        return;
      }
      window.vistaLogin.montar(document.getElementById('app-root'));
    });
  </script>
