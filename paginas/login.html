<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>FormsBiblicos — Plataforma de estudio bíblico guiado</title>
  <meta name="description" content="FormsBiblicos es una plataforma educativa para el estudio sistemático de la Biblia con repaso inteligente, evaluaciones personalizadas y seguimiento de progreso.">
  <link rel="icon" href="../assets/iconos/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/00-settings/_tokens.css">
  <link rel="stylesheet" href="../css/00-settings/_colores.css">
  <link rel="stylesheet" href="../css/00-settings/_tipografia.css">
  <link rel="stylesheet" href="../css/00-settings/_espaciado.css">
  <link rel="stylesheet" href="../css/02-generic/_reset.css">
  <link rel="stylesheet" href="../css/03-elements/_body.css">
  <link rel="stylesheet" href="../css/03-elements/_button.css">
  <link rel="stylesheet" href="../css/03-elements/_input.css">
  <link rel="stylesheet" href="../css/04-objects/_contenedor.css">
  <link rel="stylesheet" href="../css/04-objects/_pila.css">
  <link rel="stylesheet" href="../css/05-componentes/_boton-primario.css">
  <link rel="stylesheet" href="../css/05-componentes/_boton-secundario.css">
  <link rel="stylesheet" href="../css/05-componentes/_login.css">
  <link rel="stylesheet" href="../css/06-utilidades/_utilidades.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/core/store.js"></script>
  <script src="../js/core/eventBus.js"></script>
  <script src="../js/datos/supabase-client.js"></script>
  <script src="../js/datos/auth-repository.js"></script>
  <script src="../js/utilidades/dom-helpers.js"></script>
  <script src="../js/utilidades/iconos.js"></script>
  <script src="../js/vistas/vista-login.js"></script>
  <script>
    // Página standalone: persistir sesión y redirigir al SPA al iniciar sesión
    window.eventBus.suscribir('auth:login', (payload) => {
      const usuario = payload.usuario || payload;
      if (payload.recordar !== false) {
        localStorage.setItem('fb_usuario', JSON.stringify(usuario));
        localStorage.setItem('fb_recordar_sesion', 'true');
      } else {
        localStorage.removeItem('fb_usuario');
        localStorage.removeItem('fb_recordar_sesion');
        sessionStorage.setItem('fb_usuario', JSON.stringify(usuario));
      }
      window.location.href = '../index.html#!/estudio';
    });

    document.addEventListener('DOMContentLoaded', () => {
      // Si ya hay sesión activa, ir directo al SPA
      const guardado = localStorage.getItem('fb_usuario') || sessionStorage.getItem('fb_usuario');
      if (guardado) {
        window.location.href = '../index.html#!/estudio';
        return;
      }
      window.vistaLogin.montar(document.getElementById('app-root'));
    });
  </script>
</head>
<body>
  <main id="app-root"></main>
</body>
</html>
