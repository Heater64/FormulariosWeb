name: Android tagged release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VITE_UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npx cap sync android
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/formsbiblicos-${version}.apk"
          gh release create "$GITHUB_REF_NAME" "release/formsbiblicos-${version}.apk" \
            --title "FormsBiblicos ${version}" \
            --generate-notes
