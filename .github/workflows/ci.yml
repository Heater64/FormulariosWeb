name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # La URL es pública por diseño (ver docs/app-updates.md). Sin ella, el
          # guard de vite.config.js falla el build para no empaquetar una APK
          # que no puede comprobar actualizaciones.
          VITE_UPDATE_MANIFEST_URL: https://formularios-web-flax.vercel.app/version.json
