name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Public production build
        run: npm run build:public

      - name: Generate and validate study content
        run: npm run generate:study-content

      - name: Web quality gate
        run: npm run test:web-quality

      - name: Release gate
        run: npm run test:release

      - name: Diff whitespace check
        run: git diff --check

      - name: Staging isolation E2E (when configured)
        env:
          FB_STAGING_SUPABASE_URL: ${{ secrets.FB_STAGING_SUPABASE_URL }}
          FB_STAGING_SUPABASE_ANON_KEY: ${{ secrets.FB_STAGING_SUPABASE_ANON_KEY }}
          FB_STAGING_A_TOKEN: ${{ secrets.FB_STAGING_A_TOKEN }}
          FB_STAGING_B_TOKEN: ${{ secrets.FB_STAGING_B_TOKEN }}
          FB_STAGING_RESOURCES_JSON: ${{ secrets.FB_STAGING_RESOURCES_JSON }}
        run: |
          if [ -n "$FB_STAGING_SUPABASE_URL" ] && [ -n "$FB_STAGING_A_TOKEN" ] && [ -n "$FB_STAGING_B_TOKEN" ] && [ -n "$FB_STAGING_RESOURCES_JSON" ]; then
            npm run test:staging:isolation
          else
            echo "Staging isolation skipped: configure FB_STAGING_* secrets to make it a required CI check."
          fi
