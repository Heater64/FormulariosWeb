name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VITE_UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production manifest URL
        run: test -n "$VITE_UPDATE_MANIFEST_URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_ENV"

      - name: Read app version
        id: version
        run: |
          VERSION=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json')).version)")
          VERSION_CODE=$(sed -n 's/^versionCode=//p' android/version-code.properties)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Prepare release asset and checksum
        id: asset
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp "android/app/build/outputs/apk/release/app-release.apk" "release/formsbiblicos-${VERSION}.apk"
          cp "release/formsbiblicos-${VERSION}.apk" "release/formsbiblicos.apk"
          SHA256=$(sha256sum "release/formsbiblicos-${VERSION}.apk" | awk '{print $1}')
          SIZE=$(stat -c '%s' "release/formsbiblicos-${VERSION}.apk")
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" "release/formsbiblicos-${VERSION}.apk" "release/formsbiblicos.apk" \
            --title "FormsBiblicos ${VERSION}" \
            --generate-notes

      - name: Publish release data
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "### Release creada"
            echo "- version: ${VERSION}"
            echo "- versionCode: ${{ steps.version.outputs.version_code }}"
            echo "- apkUrl: https://github.com/${{ github.repository }}/releases/download/v${VERSION}/formsbiblicos.apk"
            echo "- versionedApkUrl: https://github.com/${{ github.repository }}/releases/download/v${VERSION}/formsbiblicos-${VERSION}.apk"
            echo "- sha256: ${{ steps.asset.outputs.sha256 }}"
            echo "- sizeBytes: ${{ steps.asset.outputs.size }}"
            echo ""
            echo "Actualiza version.json con estos valores y despliega Vercel."
          } >> "$GITHUB_STEP_SUMMARY"
