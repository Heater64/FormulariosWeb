name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VITE_UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guardas de fail-fast: la release solo se publica desde main, con el
      # endpoint de producción configurado y con las novedades escritas.
      - name: Validate release context
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Ejecuta el workflow desde la rama main."; exit 1; }
          test -n "$VITE_UPDATE_MANIFEST_URL" || { echo "Configura la variable pública UPDATE_MANIFEST_URL del repositorio."; exit 1; }
          test -f release-notes.md || { echo "Crea release-notes.md con las novedades (una por línea empezando por \"- \") antes de lanzar la release."; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_ENV"

      - name: Read app version
        id: version
        run: |
          VERSION=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('package.json')).version)")
          VERSION_CODE=$(sed -n 's/^versionCode=//p' android/version-code.properties)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Prepare release asset and checksum
        id: asset
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp "android/app/build/outputs/apk/release/app-release.apk" "release/formsbiblicos-${VERSION}.apk"
          cp "release/formsbiblicos-${VERSION}.apk" "release/formsbiblicos.apk"
          SHA256=$(sha256sum "release/formsbiblicos-${VERSION}.apk" | awk '{print $1}')
          SIZE=$(stat -c '%s' "release/formsbiblicos-${VERSION}.apk")
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Delete existing release with same tag (idempotent rerun)
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release delete "v${VERSION}" --yes --cleanup-tag || true

      # Orden importante: la release (con la APK subida) se crea ANTES de
      # publicar version.json, para que el manifiesto nunca anuncie una versión
      # cuya APK aún no existe.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" "release/formsbiblicos-${VERSION}.apk" "release/formsbiblicos.apk" \
            --title "FormsBiblicos ${VERSION}" \
            --notes-file release-notes.md

      # Genera version.json (versión/versionCode de las fuentes, sha256/tamaño
      # reales del asset, notas de release-notes.md; conserva minimumVersion/
      # minimumVersionCode/mandatory del manifiesto commiteado), valida el
      # resultado contra el contrato y lo publica con un commit + push: Vercel
      # despliega el manifiesto automáticamente con ese push.
      - name: Generate and publish version.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node scripts/generate-version-manifest.mjs \
            --repo "${{ github.repository }}" \
            --sha256 "${{ steps.asset.outputs.sha256 }}" \
            --size "${{ steps.asset.outputs.size }}" \
            --notes release-notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json sin cambios; no hace falta commit."
          else
            git commit -m "Manifest ${VERSION}: sha256 y tamaño reales de la release"
            git push origin main
          fi

      - name: Publish release data
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "### Release creada"
            echo "- version: ${VERSION}"
            echo "- versionCode: ${{ steps.version.outputs.version_code }}"
            echo "- apkUrl: https://github.com/${{ github.repository }}/releases/download/v${VERSION}/formsbiblicos.apk"
            echo "- versionedApkUrl: https://github.com/${{ github.repository }}/releases/download/v${VERSION}/formsbiblicos-${VERSION}.apk"
            echo "- sha256: ${{ steps.asset.outputs.sha256 }}"
            echo "- sizeBytes: ${{ steps.asset.outputs.size }}"
            echo ""
            echo "version.json generado y publicado automáticamente (commit + push a main; Vercel despliega el manifiesto)."
          } >> "$GITHUB_STEP_SUMMARY"
